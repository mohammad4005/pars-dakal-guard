name: ساخت APK نگهبان
on:
  push:
    paths: ['android_guard_app/**', '.github/workflows/build-android.yml']
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - name: دریافت Gradle
        run: wget -q https://services.gradle.org/distributions/gradle-8.10.2-bin.zip && unzip -q gradle-8.10.2-bin.zip -d $HOME
      - name: ساخت APK
        working-directory: android_guard_app
        run: $HOME/gradle-8.10.2/bin/gradle assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: pars-dakal-guard-apk
          path: android_guard_app/app/build/outputs/apk/debug/app-debug.apk
