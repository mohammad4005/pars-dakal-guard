name: ساخت APK نگهبان
on:
  push:
    paths: ['android_guard_app/**', '.github/workflows/build-android.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: '17' }
      - name: آماده‌سازی Android SDK
        run: |
          export ANDROID_HOME=$HOME/android-sdk
          mkdir -p $ANDROID_HOME/tmp $ANDROID_HOME/cmdline-tools
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q commandlinetools-linux-11076708_latest.zip -d $ANDROID_HOME/tmp
          mv $ANDROID_HOME/tmp/cmdline-tools $ANDROID_HOME/cmdline-tools/latest
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --sdk_root=$ANDROID_HOME --licenses
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --sdk_root=$ANDROID_HOME "platform-tools" "platforms;android-34" "build-tools;34.0.0"
      - name: دریافت Gradle
        run: wget -q https://services.gradle.org/distributions/gradle-8.10.2-bin.zip && unzip -q gradle-8.10.2-bin.zip -d $HOME
      - name: ساخت APK
        working-directory: android_guard_app
        continue-on-error: true
        run: ANDROID_HOME=$HOME/android-sdk $HOME/gradle-8.10.2/bin/gradle assembleDebug --stacktrace 2>&1 | tee ../gradle-build.log
      - name: نمایش نتیجهٔ ساخت
        if: always()
        run: cat gradle-build.log
      - name: ذخیرهٔ گزارش خطا در مخزن
        if: always()
        run: |
          cp gradle-build.log android-build-diagnostic.log
          git config user.name "Pars Dakal Build"
          git config user.email "build@pars-dakal.local"
          git add android-build-diagnostic.log
          git commit -m "Save Android build diagnostic"
          git push
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pars-dakal-guard-apk
          path: |
            android_guard_app/app/build/outputs/apk/debug/app-debug.apk
            gradle-build.log
      - name: تأیید خروجی APK
        run: test -f android_guard_app/app/build/outputs/apk/debug/app-debug.apk
