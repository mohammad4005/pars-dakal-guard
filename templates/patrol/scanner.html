{% extends 'base.html' %}{% block content %}<h3>اسکن ایستگاه گشت</h3><p>دوربین را به کد QR ایستگاه بگیرید. اگر اسکن خودکار پشتیبانی نشد، آدرس QR را در پایین وارد کنید.</p><video id="video" class="w-100 border rounded" autoplay playsinline></video><div class="mt-3"><label class="form-label">آدرس QR</label><input id="manual" class="form-control" placeholder="آدرس کامل کد QR"><button class="btn btn-primary mt-2" onclick="go()">ادامه</button></div>{% endblock %}{% block scripts %}<script>function go(){let v=document.getElementById('manual').value;if(v)location.href=v}if('BarcodeDetector'in window){const d=new BarcodeDetector({formats:['qr_code']});navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'}}).then(s=>{video.srcObject=s;setInterval(async()=>{let r=await d.detect(video);if(r[0])location.href=r[0].rawValue},900)}).catch(()=>{})}</script>{% endblock %}
